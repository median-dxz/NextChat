  'braces@<3.0.3': 3.0.3
  'micromatch@<4.0.8': 4.0.8
  'nanoid@>=3 <3.3.15': 3.3.15
  'picomatch@<2.3.2': 2.3.2
  'picomatch@>=4 <4.0.5': 4.0.5
  'postcss@<8.5.16': 8.5.16
  'ws@>=8 <8.21.0': 8.21.0
minimumReleaseAgeExclude:
  - eslint@10.7.0
